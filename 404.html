<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Página no encontrada</title>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Boxicons -->
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="/404.css">
</head>
<body>
  <main class="error-page">
    <section class="error-card">

      <span class="error-small-title">Oops!</span>

      <div class="error-code">
        <span class="digit">4</span>

        <div class="ball-wrapper">
          <i class='bx bx-football ball-icon'></i>
        </div>

        <span class="digit">4</span>
      </div>

      <h1 class="error-title">Página no encontrada</h1>

      <p class="error-text">
        Parece que el enlace al que intentaste acceder no existe,
        fue movido o todavía no está disponible.
      </p>

      <div class="error-actions">
        <a href="/index.html" class="btn btn-primary">Volver al inicio</a>
      </div>

      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>

      <div class="grass grass-1"></div>
      <div class="grass grass-2"></div>
      <div class="grass grass-3"></div>

      <div class="ground-shape ground-1"></div>
      <div class="ground-shape ground-2"></div>
    </section>
  </main>
</body>
</html>
